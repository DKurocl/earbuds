name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Point Gradle at the preinstalled SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log || {
            # surface compiler / resource errors as annotations (readable without log access)
            grep -E '^e: |error:|ERROR:|What went wrong' -A2 build.log | head -40 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SonyAnc-debug
          path: app/build/outputs/apk/debug/*.apk
