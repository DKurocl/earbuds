name: Publish verified build 236
on:
  push:
    branches: [codex/publish-build-236-tag]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '45650420770'
      COMMIT: '5e751db38dad0292ce8f5dc4deb8217e5158b85b'
      TAG: build-236
    steps:
      - name: Check the signed build and verification jobs
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" | jq -e --arg sha "$COMMIT" '.head_sha == $sha and .head_branch == "main"'
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" |
            jq -e '[.jobs[] | select((.name == "build" or .name == "screenshots" or .name == "visual-check") and .conclusion == "success")] | length == 3'
      - uses: actions/download-artifact@v4
        with:
          name: Earbuds-install
          path: apk
          github-token: ${{ github.token }}
          run-id: 45650420770
      - name: Publish the verified APK
        run: |
          set -euo pipefail
          mv apk/*.apk "apk/Earbuds-236.apk"
          printf 'Restored the elastic mode-button press and refined each mode icon animation.\n\n[Build and verification](https://github.com/%s/actions/runs/%s).\n' "$GH_REPO" "$SOURCE_RUN" > notes.md
          if ! gh release view "$TAG" --json isDraft,assets > release.json; then
            gh release create "$TAG" --draft --target "$COMMIT" --title "Earbuds build 236" --notes-file notes.md
            gh release view "$TAG" --json isDraft,assets > release.json
          fi
          if ! jq -e '.assets[] | select(.name == "Earbuds-236.apk" and .size > 0)' release.json >/dev/null; then
            gh release upload "$TAG" "apk/Earbuds-236.apk"
          fi
          if jq -e .isDraft release.json >/dev/null; then
            if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha > tag-sha.txt; then
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" --jq .object.sha > tag-sha.txt
            fi
            test "$(cat tag-sha.txt)" = "$COMMIT"
            gh release edit "$TAG" --draft=false --verify-tag
          fi
          gh release view "$TAG" --json isDraft,assets,url |
            jq -e '.isDraft == false and any(.assets[]; .name == "Earbuds-236.apk" and .size > 0)'
