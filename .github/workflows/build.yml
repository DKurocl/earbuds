name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hush-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Test, lint and build
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E '^e: |error:|ERROR:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hush-checks
          path: |
            app/build/reports/
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-install
          path: app/build/outputs/apk/release/*.apk
  visual-check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: Hush-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            mkdir -p screens
            adb install apk/app-debug.apk
            adb shell am start -W -n ua.olex.sonyanc/.DesignPreviewActivity --es scene anc
            sleep 3
            adb exec-out screencap -p > screens/anc-light.png
            adb shell am force-stop ua.olex.sonyanc
            adb shell cmd uimode night yes
            adb shell am start -W -n ua.olex.sonyanc/.DesignPreviewActivity --es scene ambient
            sleep 3
            adb exec-out screencap -p > screens/ambient-dark.png
            adb shell am force-stop ua.olex.sonyanc
            adb shell settings put system font_scale 1.3
            adb shell am start -W -n ua.olex.sonyanc/.DesignPreviewActivity --es scene error
            sleep 3
            adb exec-out screencap -p > screens/error-large-text.png
            adb logcat -d -s AndroidRuntime:E > screens/crash.log
            test ! -s screens/crash.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hush-visual-check
          path: screens/
